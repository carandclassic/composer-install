name: "Install PHP Dependencies with Composer"
author: "Ben Ramsey"
description: >-
  Installs and caches PHP dependencies with Composer, accepting arguments to
  configure how and what to install.

branding:
  icon: download
  color: purple

inputs:
  dependency-versions:
    description: >-
      The version of dependencies to prefer (`lowest`, `highest`, or `locked`).
    required: true
    default: "locked"
  composer-options:
    description: >-
      Additional options to pass to Composer (e.g. `--ignore-platform-reqs`).
    required: false
  working-directory:
    description: >-
      The directory where composer.json is located, if it is not in the repository root.
    required: false
  ignore-cache:
    description: >-
      Whether to ignore the cache. Values accepted: `'yes'`, `true`, `1`.
    required: false
  custom-cache-key:
    description: >-
      A custom cache key to use instead of an auto-generated cache key.
    required: false
  custom-cache-suffix:
    description: >-
      A custom suffix to add to the auto-generated cache key.
    required: false
  require-lock-file:
    description: >-
      Require lock file for install command.
    required: false
    default: "false"
  composer-filename:
    description: >-
      The Composer filename to use, without the extension (e.g. `composer`,
      `composer-gh-actions`, `composer-staging`). Please note: this is not a
      path. If you need to specify a different path, use `working-directory`.
    required: false
    default: "composer"

runs:
  using: "composite"
  steps:
    - name: "Determine PHP version"
      id: "php"
      shell: "bash"
      run: "${GITHUB_ACTION_PATH}/bin/php_version.sh"

    - name: "Determine whether we should ignore caching"
      id: "should-cache"
      shell: "bash"
      run: '${GITHUB_ACTION_PATH}/bin/should_cache.sh "${INPUTS_IGNORE_CACHE}"'
      env:
        INPUTS_IGNORE_CACHE: ${{ inputs.ignore-cache }}

    - name: "Determine Composer paths"
      id: "composer"
      shell: "bash"
      run: |
        ${GITHUB_ACTION_PATH}/bin/composer_paths.sh \
          "" \
          "${INPUTS_WORKING_DIRECTORY}" \
          "${STEPS_PHP_OUTPUTS_PATH}" \
          "${INPUTS_COMPOSER_FILENAME}"
      env:
        INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STEPS_PHP_OUTPUTS_PATH: ${{ steps.php.outputs.path }}
        INPUTS_COMPOSER_FILENAME: ${{ inputs.composer-filename }}

    - name: "Determine cache key"
      id: "cache-key"
      if: steps.should-cache.outputs.do-cache == 1
      shell: "bash"
      # zizmor: ignore[template-injection] custom-cache-suffix is shell-evaluated by design, see README
      run: |
        ${GITHUB_ACTION_PATH}/bin/cache_key.sh \
          "${RUNNER_OS}" \
          "${STEPS_PHP_OUTPUTS_VERSION}" \
          "${INPUTS_DEPENDENCY_VERSIONS}" \
          "${INPUTS_COMPOSER_OPTIONS}" \
          "${FILES_HASH}" \
          "${INPUTS_CUSTOM_CACHE_KEY}" \
          "${{ inputs.custom-cache-suffix }}" \
          "${INPUTS_WORKING_DIRECTORY}"
      env:
        STEPS_PHP_OUTPUTS_VERSION: ${{ steps.php.outputs.version }}
        INPUTS_DEPENDENCY_VERSIONS: ${{ inputs.dependency-versions }}
        INPUTS_COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        FILES_HASH: ${{ hashFiles('**/${{ inputs.composer-filename }}.json', '**/${{ inputs.composer-filename }}.lock') }}
        INPUTS_CUSTOM_CACHE_KEY: ${{ inputs.custom-cache-key }}
        INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}

    - name: "Cache Composer dependencies"
      if: steps.should-cache.outputs.do-cache == 1
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      env:
          RUNS_ON_S3_BUCKET_CACHE: cc-prenv-github-actions-cache
      with:
        path: "${{ steps.composer.outputs.cache-dir }}"
        key: "${{ steps.cache-key.outputs.key }}"
        restore-keys: |
          ${{ env.CACHE_RESTORE_KEY }}

    - name: "Install Composer dependencies"
      shell: "bash"
      run: |
        ${GITHUB_ACTION_PATH}/bin/composer_install.sh \
          "${INPUTS_DEPENDENCY_VERSIONS}" \
          "${INPUTS_COMPOSER_OPTIONS}" \
          "${INPUTS_WORKING_DIRECTORY}" \
          "${STEPS_PHP_OUTPUTS_PATH}" \
          "${STEPS_COMPOSER_OUTPUTS_COMPOSER_COMMAND}" \
          "${STEPS_COMPOSER_OUTPUTS_LOCK}" \
          "${INPUTS_REQUIRE_LOCK_FILE}" \
          "${INPUTS_COMPOSER_FILENAME}" \
      env:
        INPUTS_DEPENDENCY_VERSIONS: ${{ inputs.dependency-versions }}
        INPUTS_COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STEPS_PHP_OUTPUTS_PATH: ${{ steps.php.outputs.path }}
        STEPS_COMPOSER_OUTPUTS_COMPOSER_COMMAND: ${{ steps.composer.outputs.composer_command }}
        STEPS_COMPOSER_OUTPUTS_LOCK: ${{ steps.composer.outputs.lock }}
        INPUTS_REQUIRE_LOCK_FILE: ${{ inputs.require-lock-file }}
        INPUTS_COMPOSER_FILENAME: ${{ inputs.composer-filename }}
